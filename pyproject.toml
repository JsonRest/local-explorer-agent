[project]
name = "local-explorer-agent"
version = "0.1.0"
description = "AI agent built with Google ADK + Gemini that uses MCP to connect to Google Maps Grounding Lite for real-time place search, weather lookup, and route planning."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-adk>=1.0.0",
    "python-dotenv>=1.0.0",
    "google-auth>=2.0.0",
    "google-auth-httplib2>=0.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["local_explorer"]
